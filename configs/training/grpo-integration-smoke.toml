# T-023/E-025 fixed two-group V100 integration smoke.  Hidden task fields are
# read only by the isolated verifier; the public engine receives public_task.

[run]
run_id = "t023-e025"
training_seed = 42

[model]
model_id = "Qwen/Qwen2.5-1.5B-Instruct"
revision = "989aa7980e4cf806f80c7fef2b1adb7bc71aa306"
cache_dir = "artifacts/model-cache"
