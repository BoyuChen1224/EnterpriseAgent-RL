name: CPU checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/cpu-py312-linux.lock
            requirements/cpu-training-py312-linux.lock
      - run: python -m pip install -r requirements/cpu-training-py312-linux.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python scripts/evaluation/cpu_smoke.py
